[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe"
version = "0.1.0"
description = "Unified multi-domain PPE detection library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.1.0",
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]
edge = [
    "onnxruntime>=1.16.0",
    "onnx>=1.15.0",
    "onnxconverter-common>=1.14.0",
]

[project.scripts]
ppe = "ppe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
