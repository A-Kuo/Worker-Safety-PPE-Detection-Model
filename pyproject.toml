[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe"
version = "0.1.0"
description = "Unified multi-domain PPE detection library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.1.0",
    "numpy",
    "opencv-python",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
