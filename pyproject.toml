[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe"
version = "0.1.0"
description = "Unified multi-domain PPE detection library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.1.0",
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]
edge = [
    "onnxruntime>=1.16.0",
    "onnx>=1.15.0",
    "onnxconverter-common>=1.14.0",
]
# Only needed by scripts/fetch_checkpoint.py — not a core runtime dependency.
hf = ["huggingface_hub>=0.24"]
# Intel NPU/iGPU edge path (Lunar Lake AI Boost NPU + Arc iGPU via OpenVINO).
# `onnxruntime-openvino` occupies the same import namespace as the plain
# `onnxruntime` package in the `edge` extra above and generally cannot
# coexist with it in one environment — install this in a separate venv,
# or uninstall `onnxruntime` first. See docs/edge_npu.md.
edge-intel-npu = ["onnxruntime-openvino>=1.19.0"]

[project.scripts]
ppe = "ppe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
