[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppe"
version = "0.1.0"
description = "On-device PPE (hi-vis vest) detection: ONNX Runtime with a verifiable NPU-only mode"
readme = "README.md"
requires-python = ">=3.10"
# Runtime core is torch-free. An ONNX Runtime build is NOT listed here on purpose: plain
# `onnxruntime` and `onnxruntime-openvino` share one import namespace and must not be installed
# together, so pick exactly one of the `cpu` / `npu` extras.
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
]

[project.optional-dependencies]
# --- pick ONE inference runtime ---
cpu = ["onnxruntime>=1.16.0"]
# Intel NPU / iGPU (Lunar Lake AI Boost + Arc) through the OpenVINO execution provider.
# `openvino` is not a declared dependency of onnxruntime-openvino, but the EP needs its runtime
# DLLs (ORT 1.24 targets OpenVINO 2025.4); without it the EP fails to load and ORT silently uses
# the CPU. See docs/edge_npu.md.
npu = ["onnxruntime-openvino>=1.19.0", "openvino>=2025.4,<2026"]
# --- optional tooling ---
# Training, evaluation and `ppe export` (pulls torch).
train = ["torch", "ultralytics>=8.1.0", "roboflow", "requests"]
# `ppe quantize` (plus one of cpu / npu).
quant = ["onnx>=1.15.0", "onnxconverter-common>=1.14.0"]
# Native live window (`ppe window`). Qt, because the core uses opencv-python-headless (no imshow).
gui = ["PySide6>=6.6"]
# FastAPI + Streamlit demo under app/ (source checkout only).
app = ["fastapi", "uvicorn", "python-multipart", "streamlit"]
dev = ["pytest", "onnx>=1.15.0", "build", "twine"]
# Only needed by archive/scripts/fetch_checkpoint.py.
hf = ["huggingface_hub>=0.24"]
# --- backward-compatible aliases (used by CI and older docs) ---
edge = ["onnxruntime>=1.16.0", "onnx>=1.15.0", "onnxconverter-common>=1.14.0"]
edge-intel-npu = ["onnxruntime-openvino>=1.19.0", "openvino>=2025.4,<2026"]

[project.scripts]
ppe = "ppe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
