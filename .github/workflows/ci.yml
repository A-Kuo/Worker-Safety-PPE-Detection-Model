name: PPE CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[edge]"
    - name: Run Tests
      run: |
        pytest
    - name: Edge / NPU-capable smoke (ONNX-first)
      run: |
        # Exports Construction baseline → models/best.onnx if needed, predicts on a
        # real frame via ORT (CPU EP here; OpenVINO NPU on Lunar Lake). Also asserts
        # hard NPU mode refuses silent CPU when no NPU EP is installed.
        python scripts/smoke_edge.py --require-npu
