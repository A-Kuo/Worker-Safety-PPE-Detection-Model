name: PPE CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The product path: torch-free install, tests, generated-model smoke, then build the wheel and
  # use it from a fresh virtualenv outside the repository.
  runtime:
    name: runtime (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (no torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[cpu,dev]"
      - name: Torch must not be installed
        run: python -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('torch') or u.find_spec('ultralytics') else 0)"
      - name: Tests
        run: python -m pytest -q -rs
      - name: Edge smoke (generated model, hard NPU gate)
        run: python scripts/smoke_edge.py --require-npu
      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*
      - name: Use the wheel from a fresh venv outside the repo
        run: python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Live window: Qt runs offscreen, so no display is needed.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[cpu,gui,app,dev]"
      - name: Window and demo tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs tests/test_window.py tests/test_app_runtime.py tests/test_media_latency.py
      - name: ppe window --selftest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from ppe.testing import make_tiny_detector; make_tiny_detector('tiny.onnx')"
          ppe window --selftest --frames 30 --source synthetic --weights tiny.onnx --imgsz 64 --providers cpu

  # Training-side tooling (export, archived scripts) with CPU-only torch.
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Tests (nothing skipped for missing torch)
        run: python -m pytest -q -rs

  # Experimental native port (native/ppe-core): dependency-free Rust, parity-tested against the
  # Python decode through generated fixtures. Not part of the released package.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fixtures match the Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[cpu]"
          python scripts/gen_native_fixtures.py --check
      - name: cargo test
        working-directory: native/ppe-core
        run: cargo test
