name: Release

# Pushing a tag vX.Y.Z builds the wheel and sdist, checks them, and opens a DRAFT GitHub release with
# those files attached. Nothing is public until a maintainer:
#   1. attaches the model files (they are not in git and cannot be built here):
#        gh release upload vX.Y.Z vest_specialist.onnx vest_specialist.int8.onnx
#   2. publishes the draft.
# Then run the "Post-release check" workflow, which installs from the release and verifies the
# model hashes against src/ppe/models.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[cpu,dev]"
      - name: Tag must match the package version and the model registry
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --tag "$TAG"
      - name: Tests
        run: python -m pytest -q
      - name: Build and check
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/wheel_smoke.py
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* docs/MODEL_CARD.md \
            --draft --verify-tag --title "$TAG" \
            --notes "Draft created by CI. Attach vest_specialist.onnx and vest_specialist.int8.onnx (hashes in src/ppe/models.json), then publish. Beta: the 95% accuracy target is not met; see MODEL_CARD.md."
