name: Post-release check

# Manual: after a release is published with its model files attached, install the released wheel
# in a clean environment, download the models with `ppe fetch-model` (which enforces the SHA-256
# values packaged in the wheel) and run them.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the released wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.whl" --dir dist
      - name: Install from the wheel (no source checkout, no torch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(ls dist/*.whl)[cpu]"
          python -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('torch') else 0)"
      - name: Fetch and verify every released model
        run: ppe fetch-model --all
      - name: Run both models
        shell: bash
        run: |
          python -c "import cv2, numpy as np; cv2.imwrite('frame.png', np.full((480, 640, 3), 114, dtype=np.uint8))"
          ppe predict --source frame.png
          ppe bench --iterations 20 --warmup 3
          python - <<'EOF'
          import json, subprocess
          from ppe import models
          from ppe.paths import model_dir
          for entry in models.entries().values():
              path = model_dir() / entry.file
              assert models.is_verified(path, entry), entry.name
              out = json.loads(subprocess.check_output(["ppe", "predict", "--weights", str(path), "--source", "frame.png"]))
              assert out["model"].endswith(entry.file) and "counts" in out
              print("ok", entry.name, entry.sha256[:16])
          EOF
