# E3 — YOLOv8n + stronger industrial-camera augs (blur/brightness/occlusion-ish crop).
# Same subset/seed as E0. Native Ultralytics keys plus blur_* for the train wrapper.
experiment: e3_augs
model: yolov8n.pt
data: configs/data/combined.yaml
subset_size: 12000
epochs: 100
imgsz: 640
batch: 16  # Colab/Kaggle. Local 8GB: --batch 8
seed: 42
cos_lr: true
patience: 20
pretrained: true
optimizer: auto
fl_gamma: 0.0
close_mosaic: 10
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.6
degrees: 10.0
translate: 0.2
scale: 0.7
shear: 2.0
perspective: 0.0005
fliplr: 0.5
mosaic: 1.0
mixup: 0.15
copy_paste: 0.1
erasing: 0.5
blur_prob: 0.15
blur_limit: 3
