# E3 — YOLOv8n + stronger industrial-camera augs (brightness/occlusion-ish crop).
# Same subset/seed as E0. All keys below are native Ultralytics train() args.
#
# NOTE: `blur_prob`/`blur_limit` were removed — there is no such Ultralytics
# train() wrapper; scripts/train.py passes every config key straight to
# `model.train(**kwargs)`, so these were never functional (confirmed
# empirically: `get_cfg` rejects them the same way it rejects `fl_gamma`).
# `hsv_v` (value/brightness jitter) and `erasing` (random erasing, a
# reasonable occlusion-ish stand-in) already cover this experiment's intent
# with real, wired augmentation knobs.
experiment: e3_augs
model: yolov8n.pt
data: configs/data/combined.yaml
subset_size: 12000
epochs: 100
imgsz: 640
batch: 16  # Colab/Kaggle. Local 8GB: --batch 8
seed: 42
cos_lr: true
patience: 20
pretrained: true
optimizer: auto
close_mosaic: 10
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.6
degrees: 10.0
translate: 0.2
scale: 0.7
shear: 2.0
perspective: 0.0005
fliplr: 0.5
mosaic: 1.0
mixup: 0.15
copy_paste: 0.1
erasing: 0.5
