# E2: YOLOv8n with focal loss. Same subset and seed as E0. Aimed at no_* false negatives.
experiment: e2_focal
model: yolov8n.pt
data: configs/data/combined.yaml
subset_size: 12000
epochs: 100
imgsz: 640
batch: 16
seed: 42
cos_lr: true
patience: 20
pretrained: true
optimizer: auto
fl_gamma: 1.5
close_mosaic: 10
